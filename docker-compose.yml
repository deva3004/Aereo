services:
  waterseg:
    build: .
    image: waterbody-segmentation:latest
    volumes:
      - ./data:/data
    command: ["--input", "/data/input.tif", "--output", "/data/output.tif"]
    # GPU passthrough — uncomment on a host with an NVIDIA GPU + NVIDIA Container
    # Toolkit installed. The pipeline itself is already device-agnostic (see
    # model.py); this just controls whether a GPU is exposed to the container.
    # deploy:
