services:
  waterseg-onnx:
    build:
      context: .
      dockerfile: Dockerfile.onnx

    platform: linux/amd64 # mine is ARM but targetted is amd64
    image: waterbody-segmentation:onnx
    volumes:
      - ./data:/data

    # Writes to a different output file than the PyTorch path's docker-compose.yml
    # on purpose - keeps both outputs around to compare against each other and
    # against expected_mask.tif, instead of one overwriting the other.
    command: ["--input", "/data/input.tif", "--output", "/data/output-onnx.tif"]
